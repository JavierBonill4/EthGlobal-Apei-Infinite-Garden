<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 40" width="64" height="40" role="img" aria-label="Lane">
  <!-- GROUND TILE. 64x40 is one world tile already foreshortened by the
       camera (see ART.md "The camera"). Draw squashed; the engine does not
       transform these. All four edges must tile against any other ground,
       and nothing here may imply a light direction or the field bands. -->
  <rect width="64" height="40" fill="var(--ig-w-path,#D8CBA9)"/>
  <g fill="var(--ig-w-stone,#B9BFB6)" opacity=".62">
    <ellipse cx="15" cy="12" rx="3.4" ry="2.1"/><ellipse cx="45" cy="9" rx="2.6" ry="1.7"/>
    <ellipse cx="52" cy="28" rx="3.8" ry="2.3"/><ellipse cx="24" cy="31" rx="2.4" ry="1.6"/>
    <ellipse cx="34" cy="20" rx="2" ry="1.3"/><ellipse cx="7" cy="34" rx="2.2" ry="1.4"/>
  </g>
</svg>
