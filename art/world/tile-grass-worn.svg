<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 40" width="64" height="40" role="img" aria-label="Worn meadow ground">
  <!-- GROUND TILE. 64x40 is one world tile already foreshortened by the
       camera (see ART.md "The camera"). Draw squashed; the engine does not
       transform these. All four edges must tile against any other ground,
       and nothing here may imply a light direction or the field bands. -->
  <rect width="64" height="40" fill="var(--ig-w-grass,#A6C79A)"/>
  <ellipse cx="30" cy="22" rx="15" ry="8" fill="var(--ig-w-path,#D8CBA9)" opacity=".3"/>
  <ellipse cx="49" cy="10" rx="9" ry="5" fill="var(--ig-w-path,#D8CBA9)" opacity=".2"/>
  <g stroke="var(--ig-w-leaf-2,#4F7C50)" stroke-opacity=".34" stroke-width="1.3"
     stroke-linecap="round" fill="none">
    <path d="M8 34q1-3.5 3-5"/><path d="M58 32q1-3 2.5-4.5"/><path d="M20 6q1-3 2-4"/>
  </g>
</svg>
