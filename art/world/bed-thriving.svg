<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 48" width="64" height="48" role="img" aria-label="Planted row, thriving — lush, full">
  <!-- BED. ONE row of crops, composited over tile-soil.svg — it does not
       replace the ground. Footprint is exactly one tile (y 8..48) and the
       anchor [32,28] lands on the tile centre. One row per tile, not three:
       a 3x3 patch is three rows deep, and packing three rows into every
       tile turned the plot into a hedge with no soil visible. No frame
       either — the plot edge is the fence. -->
  <rect x="4" y="32" width="56" height="5" rx="2.5" fill="var(--ig-w-soil-2,#AB9271)" fill-opacity=".45"/>
  <g stroke="var(--ig-w-crop-thriving,#6E9E68)" stroke-width="1.7" stroke-linecap="round" fill="none">
    <path d="M12.8 31 L14.0 15.0"/><path d="M13.4 23.0 L8.8 19.2"/><path d="M13.6 25.9 L17.4 22.0"/><circle cx="14.0" cy="13.9" r="2.8" fill="var(--ig-w-crop-thriving,#6E9E68)" stroke="none"/>
    <path d="M20.5 31 L21.7 15.0"/><path d="M21.1 23.0 L16.5 19.2"/><path d="M21.3 25.9 L25.1 22.0"/><circle cx="21.7" cy="13.9" r="2.8" fill="var(--ig-w-crop-thriving,#6E9E68)" stroke="none"/>
    <path d="M28.2 31 L29.4 15.0"/><path d="M28.8 23.0 L24.2 19.2"/><path d="M29.0 25.9 L32.8 22.0"/><circle cx="29.4" cy="13.9" r="2.8" fill="var(--ig-w-crop-thriving,#6E9E68)" stroke="none"/>
    <path d="M35.8 31 L37.0 15.0"/><path d="M36.4 23.0 L31.8 19.2"/><path d="M36.6 25.9 L40.4 22.0"/><circle cx="37.0" cy="13.9" r="2.8" fill="var(--ig-w-crop-thriving,#6E9E68)" stroke="none"/>
    <path d="M43.5 31 L44.7 15.0"/><path d="M44.1 23.0 L39.5 19.2"/><path d="M44.3 25.9 L48.1 22.0"/><circle cx="44.7" cy="13.9" r="2.8" fill="var(--ig-w-crop-thriving,#6E9E68)" stroke="none"/>
    <path d="M51.2 31 L52.4 15.0"/><path d="M51.8 23.0 L47.2 19.2"/><path d="M52.0 25.9 L55.8 22.0"/><circle cx="52.4" cy="13.9" r="2.8" fill="var(--ig-w-crop-thriving,#6E9E68)" stroke="none"/>
  </g>
</svg>
