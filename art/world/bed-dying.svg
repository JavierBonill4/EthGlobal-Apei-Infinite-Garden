<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 48" width="64" height="48" role="img" aria-label="Planted row, dying — bare, cracked">
  <!-- BED. ONE row of crops, composited over tile-soil.svg — it does not
       replace the ground. Footprint is exactly one tile (y 8..48) and the
       anchor [32,28] lands on the tile centre. One row per tile, not three:
       a 3x3 patch is three rows deep, and packing three rows into every
       tile turned the plot into a hedge with no soil visible. No frame
       either — the plot edge is the fence. -->
  <rect x="4" y="32" width="56" height="5" rx="2.5" fill="var(--ig-w-soil-2,#AB9271)" fill-opacity=".45"/>
  <g stroke="var(--ig-w-soil-2,#AB9271)" stroke-width="1.1" stroke-opacity=".8" fill="none" stroke-linecap="round">
    <path d="M12 18 l5 6 l-2 5"/><path d="M47 42 l-6 -5 l2 -6"/>
  </g>
  <g stroke="var(--ig-w-crop-dying,#A8865A)" stroke-width="1.7" stroke-linecap="round" fill="none">
    <path d="M20.5 31 L26.2 27.0"/><path d="M21.1 29.0 L16.5 28.0"/><path d="M21.3 29.7 L25.1 28.8"/>
    <path d="M43.5 31 L49.2 27.0"/><path d="M44.1 29.0 L39.5 28.0"/><path d="M44.3 29.7 L48.1 28.8"/>
  </g>
</svg>
