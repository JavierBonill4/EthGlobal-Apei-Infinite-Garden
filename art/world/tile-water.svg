<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 40" width="64" height="40" role="img" aria-label="Water">
  <!-- GROUND TILE. 64x40 is one world tile already foreshortened by the
       camera (see ART.md "The camera"). Draw squashed; the engine does not
       transform these. All four edges must tile against any other ground,
       and nothing here may imply a light direction or the field bands. -->
  <rect width="64" height="40" fill="var(--ig-w-water,#7CBBCB)"/>
  <rect y="0" width="64" height="14" fill="var(--ig-w-water-2,#5C9EB4)" opacity=".38"/>
  <g stroke="#FFFFFF" stroke-opacity=".4" stroke-width="1.5" stroke-linecap="round" fill="none">
    <path d="M9 13q5-2 10 0"/><path d="M36 9q5-2 10 0"/>
    <path d="M20 27q5-2 10 0"/><path d="M45 31q5-2 10 0"/>
  </g>
</svg>
