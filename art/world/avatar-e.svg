<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 34 54" width="34" height="54" role="img" aria-label="Gardener facing right (east)">
  <!-- Avatar, facing right (east). Anchor [17,50] = the feet. Billboard: never
       squashed by the camera, so the player stands UP out of the ground plane. -->
  <ellipse cx="17" cy="50" rx="9" ry="3" fill="var(--ig-w-ink,#26383A)" fill-opacity=".18"/>
  <g stroke="var(--ig-w-ink,#26383A)" stroke-opacity=".6" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round">
    <path d="M13 50 L13 43" stroke="var(--ig-w-cloth-2,#2C4F62)" stroke-width="4"/>
    <path d="M21 50 L21 43" stroke="var(--ig-w-cloth-2,#2C4F62)" stroke-width="4"/>
    <path d="M9 44 L9 26 q8 -4 16 0 L25 44 Z" fill="var(--ig-w-cloth,#3E6E86)"/>
    <path d="M20 30 L27 39" fill="none" stroke="var(--ig-w-cloth,#3E6E86)" stroke-width="3.4"/>
    <circle cx="17" cy="18" r="8" fill="var(--ig-w-skin,#E6C6A8)"/>
    <path d="M9 16 q2 -10 8 -10 q7 0 8 10 q-4 -3 -9 -2 q-4 0 -7 2 Z" fill="#3A2E28"/>
    <circle cx="21" cy="19" r="1.2" fill="var(--ig-w-ink,#26383A)" stroke="none"/><path d="M25 20 q1.5 -1 0 -2.4" fill="var(--ig-w-skin,#E6C6A8)" stroke-width="1.1"/>
  </g>
  <g stroke="var(--ig-w-ink,#26383A)" stroke-opacity=".55" stroke-width="1.3" stroke-linejoin="round">
    <path d="M25 38 L33 38 L32 45 L26 45 Z" fill="var(--ig-w-stone,#B9BFB6)"/>
    <path d="M25 40 L21 43" fill="none" stroke="var(--ig-w-stone,#B9BFB6)" stroke-width="2"/>
  </g>
</svg>
