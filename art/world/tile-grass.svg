<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 40" width="64" height="40" role="img" aria-label="Meadow ground">
  <!-- GROUND TILE. 64x40 is one world tile already foreshortened by the
       camera (see ART.md "The camera"). Draw squashed; the engine does not
       transform these. All four edges must tile against any other ground,
       and nothing here may imply a light direction or the field bands. -->
  <rect width="64" height="40" fill="var(--ig-w-grass,#A6C79A)"/>
  <g stroke="var(--ig-w-leaf-2,#4F7C50)" stroke-opacity=".4" stroke-width="1.3"
     stroke-linecap="round" fill="none">
    <path d="M11 31q1-4 3.5-6"/><path d="M14 31q0-3 1-5"/>
    <path d="M40 25q1-4 3.5-5.5"/><path d="M43 25q0-2.5 1-4.5"/>
    <path d="M26 14q1-3 3-4.5"/><path d="M54 35q1-3.5 3-5"/>
    <path d="M6 8q1-3 2.5-4.5"/><path d="M60 19q1-3 2-4.5"/>
  </g>
</svg>
