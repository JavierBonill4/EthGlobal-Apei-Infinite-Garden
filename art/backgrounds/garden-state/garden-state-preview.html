<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Garden State — overview preview</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #0f1512; font-family: system-ui, sans-serif;
  }

  #viewport {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    background: #0f1512;
  }

  /* The stage is locked to the artwork's own 1920x1080 ratio and never
     cropped (letterboxed instead if the window isn't 16:9). Every flower
     below is positioned as a percentage of THIS box, which is what lets
     "300px" and "35px" mean actual pixels of the source art at any window
     size, instead of drifting with the viewport like a plain % of the
     screen would. */
  #stage {
    position: relative;
    width: min(100vw, 100vh * 16 / 9);
    height: min(100vh, 100vw * 9 / 16);
  }

  #stage > img {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    user-select: none;
    -webkit-user-drag: none;
    pointer-events: none;
  }
  #backdrop { z-index: 0; }
  /* The center tree renders above every flower, however dense the field
     gets -- see CENTER_TREE_Z in the script. */
  #centerTree { z-index: 2000; }

  #field {
    position: absolute; inset: 0;
  }
  .plot {
    position: absolute;
    transform: translate(-50%, -50%);
    pointer-events: auto;
    transition: transform 120ms ease;
  }
  .plot img {
    display: block;
    user-select: none;
    -webkit-user-drag: none;
  }
  .plot:hover {
    transform: translate(-50%, -50%) scale(1.6);
    z-index: 1500 !important;
  }

  #tooltip {
    position: absolute;
    transform: translate(-50%, -140%);
    background: rgba(15, 21, 18, .85);
    color: #eaf1ec;
    font-size: 12px;
    padding: 5px 9px;
    border-radius: 6px;
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
    transition: opacity 120ms ease;
    z-index: 3000;
  }
  #tooltip b { color: #7fe3c9; }
  #tooltip.shown { opacity: 1; }

  #hud {
    position: absolute; top: 14px; left: 14px;
    color: #eaf1ec; font-size: 13px; line-height: 1.5;
    background: rgba(15, 21, 18, .55);
    padding: 8px 12px; border-radius: 8px;
    z-index: 3000;
  }
  #hud b { color: #7fe3c9; }

  #nav {
    position: absolute; top: 14px; right: 14px;
    display: flex; gap: 8px;
    z-index: 3000;
  }
  /* Real links, not JS-driven buttons -- navigation works even if something
     elsewhere on the page throws, and cmd/ctrl-click to open in a new tab
     works the way people expect. */
  #nav a, #nav .nav-disabled {
    font-family: inherit; font-size: 12px; text-decoration: none;
    background: rgba(15, 21, 18, .65);
    color: #eaf1ec;
    border: 1px solid rgba(234, 241, 236, .25);
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
  }
  #nav a:hover {
    border-color: #7fe3c9;
    color: #7fe3c9;
  }
  #nav .nav-disabled {
    opacity: .45;
    cursor: default;
  }

  /* Bottom-right readout: the garden's aggregate state, derived from every
     flower's rank. Replaces the old flower-stage legend. */
  #gardenHealth {
    position: absolute; bottom: 14px; right: 14px;
    background: rgba(15, 21, 18, .55);
    color: #eaf1ec;
    padding: 10px 14px;
    border-radius: 10px;
    z-index: 3000;
    min-width: 190px;
  }
  #gardenHealth .label {
    font-size: 11px; letter-spacing: .04em; text-transform: uppercase;
    color: #b7c4bd; margin: 0 0 4px;
  }
  #gardenHealth .value {
    font-family: ui-monospace, monospace; font-size: 20px;
    margin: 0 0 6px;
  }
  #gardenHealth .value b { color: #7fe3c9; }
  #gardenHealth .value span { color: #b7c4bd; font-size: 13px; }
  #gardenHealth .bar {
    height: 6px; border-radius: 3px;
    background: rgba(234, 241, 236, .15);
    overflow: hidden;
  }
  #gardenHealth .bar i {
    display: block; height: 100%;
    background: #7fe3c9;
  }
</style>
</head>
<body>

<div id="viewport">
  <div id="stage">
    <img id="backdrop" src="Garden%20State.png" alt="">
    <div id="field"></div>
    <img id="centerTree" src="Center%20Tree.png" alt="">
    <div id="tooltip"></div>
  </div>

  <div id="hud">
    <b id="playerCount">500</b> players scattered · center-weighted<br>
    110px kept clear around the tree · 20px between flowers
  </div>

  <div id="nav">
    <a href="../stroll/stroll-preview.html">→ Stroll view</a>
    <span class="nav-disabled" title="not built yet">→ Third view (soon)</span>
  </div>

  <div id="gardenHealth">
    <p class="label">Garden health</p>
    <p class="value"><b id="healthPct">--%</b> <span id="healthBand"></span></p>
    <div class="bar"><i id="healthBar" style="width:0%"></i></div>
  </div>
</div>

<script>
  // ---- config, all distances in native canvas pixels (the art is 1920x1080)
  const CANVAS_W = 1920, CANVAS_H = 1080;
  const CENTER   = { x: CANVAS_W / 2, y: CANVAS_H / 2 }; // matches Center Tree.png's trunk position

  const PLAYER_COUNT = 500;

  const EXCLUSION_RADIUS = 110; // px around the tree -- no flower may spawn inside this
  const MIN_SPACING      = 20;  // px, minimum distance kept between any two flower centres
  const MAX_ATTEMPTS     = 300; // per flower, before giving up on the spacing rule for it

  // The field's outer footprint -- an ellipse so it echoes the 16:9 canvas
  // rather than a circle. Leaves a margin so flowers don't crowd the frame.
  const FIELD_A = 900; // semi-width, px
  const FIELD_B = 500; // semi-height, px

  // How tightly players cluster toward the tree. 1 = even spread across the
  // annulus between the exclusion ring and the outer edge; higher = denser
  // near the ring, sparser toward the edge.
  const CENTER_BIAS = 1.9;

  // This is mid-season, not day one: the population spans the full -2..8
  // range art exists for, weighted so climbing gets exponentially harder --
  // each rank above 0 is worth roughly 2/3 the weight of the one before it.
  // Most players still sit low/mid; +8 is a real rarity.
  const RANK_WEIGHTS = {
    "-2": 3, "-1": 8, "0": 20, "1": 15, "2": 10,
    "3": 6, "4": 3.6, "5": 2.2, "6": 1.3, "7": 0.8, "8": 0.5,
  };

  // Weighting alone still lets +8 spike well above what "exponentially
  // rare" should allow (it's the tail of a random draw, so unlucky runs
  // happen) -- so it's also a hard ceiling, enforced after assignment.
  const MAX_RANK_8 = 5;

  const FLOWER_SIZE = 30;      // displayed px at native resolution, before jitter
  const SIZE_JITTER = 0.35;    // +/- fraction of FLOWER_SIZE

  // ---- weighted rank pick --------------------------------------------------
  function weightedRank() {
    const entries = Object.entries(RANK_WEIGHTS);
    const total = entries.reduce((s, [, w]) => s + w, 0);
    let roll = Math.random() * total;
    for (const [rank, w] of entries) {
      if (roll < w) return Number(rank);
      roll -= w;
    }
    return 0;
  }

  // Random weighting can still spike past MAX_RANK_8 by chance -- enforce
  // the cap for real by demoting the excess down to rank 7.
  function enforceRankCaps(ranks) {
    const at8 = [];
    ranks.forEach((r, i) => { if (r === 8) at8.push(i); });
    if (at8.length <= MAX_RANK_8) return ranks;
    // Keep a random MAX_RANK_8 of them at +8; demote the rest.
    for (let i = at8.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [at8[i], at8[j]] = [at8[j], at8[i]];
    }
    for (const idx of at8.slice(MAX_RANK_8)) ranks[idx] = 7;
    return ranks;
  }

  // ---- placement: center-weighted, outside the exclusion ring, spaced apart
  function ellipseRadiusAtAngle(theta, a, b) {
    const cos = Math.cos(theta), sin = Math.sin(theta);
    return (a * b) / Math.sqrt((b * cos) ** 2 + (a * sin) ** 2);
  }

  function sampleCandidate() {
    const theta = Math.random() * Math.PI * 2;
    const rMax = ellipseRadiusAtAngle(theta, FIELD_A, FIELD_B);
    const t = Math.pow(Math.random(), CENTER_BIAS); // 0..1, biased toward 0
    // Sample only within the valid annulus (outside the exclusion ring) --
    // sampling the whole ellipse and rejecting hits near the tree wastes
    // most of the center-biased draws exactly where they're not allowed.
    const r = EXCLUSION_RADIUS + t * (rMax - EXCLUSION_RADIUS);
    return { x: CENTER.x + Math.cos(theta) * r, y: CENTER.y + Math.sin(theta) * r };
  }

  function placeFlowers(n) {
    const placed = [];
    for (let i = 0; i < n; i++) {
      let point = null;
      for (let attempt = 0; attempt < MAX_ATTEMPTS; attempt++) {
        const candidate = sampleCandidate();
        let ok = true;
        for (const q of placed) {
          const dx = candidate.x - q.x, dy = candidate.y - q.y;
          if (dx * dx + dy * dy < MIN_SPACING * MIN_SPACING) { ok = false; break; }
        }
        if (ok) { point = candidate; break; }
      }
      placed.push(point || sampleCandidate()); // fallback: place anyway rather than drop a player
    }
    return placed;
  }

  // ---- build the field ------------------------------------------------------
  const field = document.getElementById("field");
  const tooltip = document.getElementById("tooltip");
  const points = placeFlowers(PLAYER_COUNT);
  const ranks = enforceRankCaps(points.map(() => weightedRank()));

  points.forEach((p, i) => {
    const rank = ranks[i];
    const size = FLOWER_SIZE * (1 - SIZE_JITTER / 2 + Math.random() * SIZE_JITTER);
    const rotate = (Math.random() * 30 - 15).toFixed(1);
    const leftPct = (p.x / CANVAS_W) * 100;
    const topPct  = (p.y / CANVAS_H) * 100;

    const el = document.createElement("div");
    el.className = "plot";
    el.style.left = leftPct + "%";
    el.style.top = topPct + "%";
    // Depth-sort by vertical position (native px, well under centerTree's 2000).
    el.style.zIndex = Math.round(p.y);
    el.innerHTML = `<img src="Flower${rank}.png" style="width:${size.toFixed(1)}px;height:${size.toFixed(1)}px;transform:rotate(${rotate}deg)" alt="">`;

    const player = i + 1;
    el.addEventListener("mouseenter", () => {
      tooltip.innerHTML = `Player <b>#${player}</b> — rank <b>${rank >= 0 ? "+" + rank : rank}</b>`;
      tooltip.style.left = leftPct + "%";
      tooltip.style.top = topPct + "%";
      tooltip.classList.add("shown");
    });
    el.addEventListener("mouseleave", () => tooltip.classList.remove("shown"));

    field.appendChild(el);
  });

  document.getElementById("playerCount").textContent = PLAYER_COUNT;

  // ---- garden health: one number summarising every flower on the field ----
  // Average rank, normalised across the full -2..8 art range, banded with
  // the same thriving/steady/stressed/dying language the rest of the game
  // uses for plot health (see docs/DESIGN.md and art/ART.md).
  const RANK_MIN = -2, RANK_MAX = 8;
  const avgRank = ranks.reduce((s, r) => s + r, 0) / ranks.length;
  const healthPct = Math.round(((avgRank - RANK_MIN) / (RANK_MAX - RANK_MIN)) * 100);
  const band =
    healthPct >= 70 ? "thriving" :
    healthPct >= 40 ? "steady" :
    healthPct >= 15 ? "stressed" : "dying";

  document.getElementById("healthPct").textContent = healthPct + "%";
  document.getElementById("healthBand").textContent = "· " + band;
  document.getElementById("healthBar").style.width = healthPct + "%";
</script>

</body>
</html>
